<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ночной зоопарк</title>
<meta name="description" content="Игра: ночью из клеток разбежались звери. Свети фонариком, ищи светящиеся глаза и найди тех, кого просят!">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2320305e'/><circle cx='34' cy='50' r='12' fill='%23ffd84a'/><circle cx='66' cy='50' r='12' fill='%23ffd84a'/><circle cx='34' cy='50' r='5' fill='%231f1a2e'/><circle cx='66' cy='50' r='5' fill='%231f1a2e'/></svg>">
<style>
  :root {
    --bg: #141a36;
    --bg2: #222b55;
    --text: #f4f1ff;
    --card: #2b3466;
    --card2: #39447f;
    --accent: #ffc83d;
    --good: #5ed47a;
    --bad: #ff6b6b;
    --line: #1f1a2e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: "Trebuchet MS", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg) 70%) fixed;
    background-color: var(--bg);
    min-height: 100vh;
    user-select: none; -webkit-user-select: none;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 12px 16px 24px; }
  .screen { display: none; }
  .screen.on { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
  button { font-family: inherit; color: inherit; cursor: pointer; border: none; }
  .big {
    display: block; width: 100%; font-size: 22px; font-weight: bold; padding: 16px;
    border-radius: 22px; background: var(--card2); box-shadow: 0 5px 0 #151a3a; margin: 12px 0; transition: transform .08s;
  }
  .big small { display: block; font-size: 15px; font-weight: normal; opacity: .8; margin-top: 3px; }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 #151a3a; }
  .big.go { background: linear-gradient(135deg, #ffd45e, #ff9f3d); color: #3b2a20; }
  .pill { background: var(--card); padding: 7px 14px; border-radius: 20px; box-shadow: 0 3px 0 #151a3a; font-size: 17px; white-space: nowrap; }
  .back { background: var(--card); padding: 8px 14px; border-radius: 20px; box-shadow: 0 3px 0 #151a3a; font-size: 17px; }
  .icon-btn { background: var(--card); border-radius: 50%; width: 40px; height: 40px; box-shadow: 0 3px 0 #151a3a; display: grid; place-items: center; }

  /* Меню */
  #menu { text-align: center; }
  #menu h1 { font-size: 44px; margin: 20px 0 6px; text-shadow: 0 0 18px rgba(255, 216, 74, .35); }
  .hero { display: flex; justify-content: center; align-items: center; gap: 6px; margin: 4px 0; }
  .hero .t { animation: sway 2.4s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes sway { 50% { transform: rotate(8deg); } }
  .glow-eyes { display: flex; gap: 22px; justify-content: center; margin: 8px 0 2px; }
  .glow-eyes span { width: 46px; height: 18px; display: flex; justify-content: space-between; animation: blink 3.2s infinite; }
  .glow-eyes span:nth-child(2) { animation-delay: 1.1s; }
  .glow-eyes span:nth-child(3) { animation-delay: 2.1s; }
  .glow-eyes i { width: 16px; height: 16px; border-radius: 50%; background: #ffd84a; box-shadow: 0 0 12px #ffd84a; }
  .glow-eyes span:nth-child(2) i { background: #b6ff6a; box-shadow: 0 0 12px #b6ff6a; }
  .glow-eyes span:nth-child(3) i { background: #ff6a6a; box-shadow: 0 0 12px #ff6a6a; }
  @keyframes blink { 0%, 44%, 52%, 100% { transform: scaleY(1); } 48% { transform: scaleY(.1); } }
  .lead { font-size: 18px; line-height: 1.45; margin: 10px 4px; }
  .muted { opacity: .75; font-size: 16px; }

  /* Игра */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .right { display: flex; gap: 8px; align-items: center; }
  .task { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 10px; margin: 10px 0 8px; min-height: 48px; }
  .task .it { display: flex; align-items: center; gap: 4px; background: var(--card); border-radius: 16px; padding: 3px 10px 3px 4px; font-size: 20px; font-weight: bold; transition: background .3s; }
  .task .it.done { background: #2f7a4a; }
  .stage { position: relative; border-radius: 22px; overflow: hidden; border: 4px solid #0b0e22; box-shadow: 0 8px 30px rgba(0, 0, 0, .4); touch-action: none; }
  .stage.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #scene { display: block; width: 100%; height: auto; cursor: none; }
  .an { cursor: pointer; }
  .covers, .dark, .eyes, #beam { pointer-events: none; }
  .eye-pair { animation: blinkEyes 4s infinite; transform-box: fill-box; transform-origin: center; }
  .eyes.sometimes .eye-pair { animation: peek 5s infinite; }
  .eyes.rare .eye-pair { animation: peekRare 6s infinite; }
  @keyframes blinkEyes { 0%, 46%, 50%, 100% { transform: scaleY(1); } 48% { transform: scaleY(.1); } }
  @keyframes peek { 0%, 60% { opacity: 1; } 68%, 92% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes peekRare { 0%, 30% { opacity: 1; } 38%, 92% { opacity: 0; } 100% { opacity: 1; } }
  .star { animation: twinkle 2.6s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: .3; } }
  .found-an { animation: hop .5s ease; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes hop { 40% { transform: translateY(-14px) scale(1.08); } }
  .moving { transition: opacity .35s; }
  .hint { text-align: center; font-size: 15px; opacity: .8; margin: 8px 0 0; min-height: 20px; }
  .float { position: absolute; font-weight: bold; font-size: 22px; pointer-events: none; animation: up 1s ease forwards; text-shadow: 0 2px 4px #000; }
  @keyframes up { to { transform: translateY(-40px); opacity: 0; } }

  /* Карточки поверх */
  .overlay { position: fixed; inset: 0; background: rgba(6, 8, 24, .72); display: none; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
  .overlay.on { display: flex; animation: fade .2s; }
  .card { background: var(--card); border: 3px solid #4d5aa0; border-radius: 26px; padding: 20px 18px; width: min(100%, 400px); text-align: center; }
  .card h2 { margin: 2px 0 8px; font-size: 28px; }
  .card .task { margin: 12px 0; }
  .stars { display: flex; justify-content: center; gap: 6px; margin: 8px 0; }
  .stars svg { animation: pop .4s ease backwards; }
  .stars svg:nth-child(2) { animation-delay: .15s; } .stars svg:nth-child(3) { animation-delay: .3s; }
  @keyframes pop { from { transform: scale(0); } }
  .card p { font-size: 17px; line-height: 1.45; margin: 6px 0; }
</style>
</head>
<body>
<div class="wrap">

<section class="screen on" id="menu">
  <h1>Ночной зоопарк</h1>
  <div class="glow-eyes"><span><i></i><i></i></span><span><i></i><i></i></span><span><i></i><i></i></span></div>
  <div class="hero"><div id="heroL"></div><div class="t" id="heroTorch"></div><div id="heroR"></div></div>
  <p class="lead">Ночью из клеток разбежались звери! Свети фонариком: в темноте видно только <b>светящиеся глаза</b>. Найди тех, кого просит сторож, пока не сел фонарик.</p>
  <button class="big go" id="playBtn"></button>
  <button class="big" id="restartBtn" style="display:none">Начать с первой ночи</button>
  <div class="muted" id="menuStars"></div>
</section>

<section class="screen" id="game">
  <div class="topbar">
    <button class="back" id="toMenu">← Меню</button>
    <span class="pill" id="nightNo"></span>
    <div class="right"><span id="battery"></span><button class="icon-btn" id="soundBtn" aria-label="Звук"></button></div>
  </div>
  <div class="task" id="task"></div>
  <div class="stage" id="stage">
    <svg id="scene" viewBox="0 0 360 540" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="hole"><stop offset="0" stop-color="#000"/><stop offset=".62" stop-color="#000"/><stop offset="1" stop-color="#fff"/></radialGradient>
        <mask id="lightMask" maskUnits="userSpaceOnUse" x="0" y="0" width="360" height="540">
          <rect width="360" height="540" fill="#fff"/>
          <circle id="hole1" cx="180" cy="300" r="70" fill="url(#hole)"/>
        </mask>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <g id="bg"></g>
      <g id="animals"></g>
      <g id="covers" class="covers"></g>
      <rect class="dark" width="360" height="540" fill="#03040d" opacity=".985" mask="url(#lightMask)"/>
      <g id="eyes" class="eyes"></g>
      <g id="found"></g>
      <circle id="beam" cx="180" cy="300" r="70" fill="none" stroke="#fff6c8" stroke-width="2" opacity=".25"/>
    </svg>
  </div>
  <div class="hint" id="hint"></div>
</section>

</div>

<div class="overlay" id="overlay"><div class="card" id="card"></div></div>

<script src="art.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const rnd = (n) => Math.floor(Math.random() * n);
const pick = (a) => a[rnd(a.length)];
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const NS = 'http://www.w3.org/2000/svg';

// ---------- Звук ----------
let actx = null, soundOn = store.get('zoo.sound', true);
function tone(freq, dur, type = 'sine', delay = 0, vol = 0.14) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch {}
}
const sfx = {
  found() { tone(660, .12, 'triangle'); tone(990, .18, 'triangle', .08); },
  wrong() { tone(200, .22, 'sawtooth', 0, .07); },
  click() { tone(1200, .03, 'square', 0, .05); },
  win() { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, .2, 'triangle', i * .1)); },
  lose() { [440, 370, 311, 262].forEach((f, i) => tone(f, .25, 'triangle', i * .15)); },
  tick() { tone(880, .04, 'square', 0, .04); },
};
function drawSound() { $('soundBtn').innerHTML = ICON.sound(soundOn); }
$('soundBtn').onclick = () => { soundOn = !soundOn; store.set('zoo.sound', soundOn); drawSound(); };

// ---------- Прогресс ----------
let progress = store.get('zoo.progress', { night: 1, stars: {} });
const totalStars = () => Object.values(progress.stars).reduce((a, b) => a + b, 0);

function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
function drawMenu() {
  stopTimers();
  $('overlay').classList.remove('on');
  $('heroL').innerHTML = animalIcon('owl', 90);
  $('heroTorch').innerHTML = ICON.torch(110);
  $('heroR').innerHTML = animalIcon('raccoon', 90);
  $('playBtn').innerHTML = progress.night > 1 ? `Играть: ночь №${progress.night}<small>Продолжить с того места</small>` : 'Играть<small>Ночь №1</small>';
  $('restartBtn').style.display = progress.night > 1 ? '' : 'none';
  const st = totalStars();
  $('menuStars').innerHTML = st ? `Собрано звёзд: ${st}` : '';
  show('menu');
}
$('playBtn').onclick = () => startNight(progress.night);
$('restartBtn').onclick = () => startNight(1);
$('toMenu').onclick = drawMenu;

// ---------- Ночь ----------
let G = null, tickT = null, moveT = null;
function stopTimers() { clearInterval(tickT); clearInterval(moveT); }

function config(n) {
  const ids = shuffle(Object.keys(ANIMALS));
  const types = Math.min(1 + Math.floor((n - 1) / 2), 3);
  const per = Math.min(1 + Math.floor(n / 3), 3);
  const need = {};
  ids.slice(0, types).forEach(id => need[id] = 1 + rnd(per));
  let total = Object.values(need).reduce((a, b) => a + b, 0);
  const decoyKinds = ids.slice(types);
  const decoys = Math.min(1 + n, SPOTS.length - 1 - total);
  return {
    need, total,
    decoys: Array.from({ length: Math.max(0, decoys) }, () => pick(decoyKinds)),
    radius: Math.max(42, 78 - n * 4),
    battery: Math.max(22, 42 - n) + total * 5,
    eyes: n <= 2 ? '' : n <= 5 ? 'sometimes' : 'rare',
    moveEvery: n >= 4 ? Math.max(3, 8 - (n - 4) * 0.7) : 0,
  };
}

function startNight(n) {
  stopTimers();
  const c = config(n);
  const spots = shuffle(SPOTS.map((s, i) => i));
  const list = [];
  Object.entries(c.need).forEach(([id, q]) => { for (let i = 0; i < q; i++) list.push({ id, target: true }); });
  c.decoys.forEach(id => list.push({ id, target: false }));
  list.forEach((a, i) => { a.spot = spots[i]; a.found = false; a.key = i; });
  G = { n, c, list, foundCount: {}, battery: c.battery, light: { x: 180, y: 300 }, running: false };
  drawSound();
  $('nightNo').textContent = `Ночь №${n}`;
  $('bg').innerHTML = backgroundSvg();
  $('found').innerHTML = '';
  $('eyes').setAttribute('class', 'eyes ' + c.eyes);
  setRadius(c.radius);
  renderAll();
  drawTask(); drawBattery();
  $('hint').textContent = n === 1 ? 'Води пальцем или мышкой — это фонарик. Нажми на зверя, когда увидишь его.' : '';
  show('game');
  card(`<h2>Ночь №${n}</h2>
    <p>Сторож просит найти:</p>
    <div class="task">${taskHtml()}</div>
    ${n === 3 ? '<p>Теперь глаза светятся не всё время — звери моргают!</p>' : ''}
    ${n === 4 ? '<p>Осторожно: звери начали перебегать с места на место!</p>' : ''}
    ${n === 6 ? '<p>Звери стали хитрее: глаза видно совсем редко.</p>' : ''}
    <button class="big go" id="goBtn">Включить фонарик</button>`);
  $('goBtn').onclick = () => { $('overlay').classList.remove('on'); sfx.click(); G.running = true; startTimers(); };
}

function startTimers() {
  tickT = setInterval(() => {
    if (!G.running) return;
    G.battery -= 0.1;
    const k = G.battery / G.c.battery;
    if (k < .2 && Math.round(G.battery * 10) % 10 === 0) sfx.tick();
    drawBattery();
    if (G.battery <= 0) lose();
  }, 100);
  if (G.c.moveEvery) moveT = setInterval(moveSomeone, G.c.moveEvery * 1000);
}

function setRadius(r) {
  $('hole1').setAttribute('r', r);
  $('beam').setAttribute('r', r * .9);
}
function setLight(x, y) {
  G.light = { x, y };
  for (const el of [$('hole1'), $('beam')]) { el.setAttribute('cx', x); el.setAttribute('cy', y); }
}

function boxOf(a) { const s = SPOTS[a.spot]; return { x: s.x - s.s / 2, y: s.y - s.s, s: s.s }; }
function renderAll() {
  $('animals').innerHTML = ''; $('covers').innerHTML = ''; $('eyes').innerHTML = '';
  let covers = '';
  SPOTS.forEach(s => covers += coverSvg(s));
  $('covers').innerHTML = covers;
  G.list.forEach(a => { if (!a.found) placeAnimal(a); });
}
function placeAnimal(a) {
  const b = boxOf(a), A = ANIMALS[a.id];
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'an moving');
  g.dataset.key = a.key;
  g.innerHTML = `<svg x="${b.x}" y="${b.y}" width="${b.s}" height="${b.s}" viewBox="0 0 100 100">${A.svg}</svg>`;
  g.addEventListener('pointerdown', (e) => { e.stopPropagation(); lightFromEvent(e); tapAnimal(a); });
  $('animals').appendChild(g);
  a.el = g;
  const eg = document.createElementNS(NS, 'g');
  eg.setAttribute('class', 'eye-pair');
  eg.style.animationDelay = (-Math.random() * 5).toFixed(2) + 's';
  eg.innerHTML = A.eyes.map(([ex, ey]) => `<circle cx="${b.x + ex / 100 * b.s}" cy="${b.y + ey / 100 * b.s}" r="${b.s * .05}" fill="${A.eyeColor}" filter="url(#glow)"/>`).join('');
  $('eyes').appendChild(eg);
  a.eyeEl = eg;
}
function removeAnimal(a) { a.el && a.el.remove(); a.eyeEl && a.eyeEl.remove(); a.el = a.eyeEl = null; }

function isLit(a) {
  const s = SPOTS[a.spot];
  const dx = s.x - G.light.x, dy = (s.y - s.s * .7) - G.light.y;
  return Math.hypot(dx, dy) < G.c.radius * .8 + s.s * .3;
}

function moveSomeone() {
  if (!G.running) return;
  const busy = new Set(G.list.filter(a => !a.found).map(a => a.spot));
  const free = SPOTS.map((s, i) => i).filter(i => !busy.has(i));
  const movers = G.list.filter(a => !a.found && !isLit(a));
  if (!free.length || !movers.length) return;
  const a = pick(movers);
  const dark = free.filter(i => { const s = SPOTS[i]; return Math.hypot(s.x - G.light.x, s.y - s.s * .7 - G.light.y) > G.c.radius + 30; });
  const to = pick(dark.length ? dark : free);
  a.el.style.opacity = 0; a.eyeEl.style.opacity = 0;
  setTimeout(() => { if (a.found) return; removeAnimal(a); a.spot = to; placeAnimal(a); }, 350);
}

// ---------- Фонарик ----------
const scene = $('scene');
function toScene(e) {
  const pt = scene.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(scene.getScreenCTM().inverse());
  return { x: Math.max(0, Math.min(360, p.x)), y: Math.max(0, Math.min(540, p.y)) };
}
function lightFromEvent(e) { if (!G || !G.running) return; const p = toScene(e); setLight(p.x, p.y); }
scene.addEventListener('pointermove', lightFromEvent);
scene.addEventListener('pointerdown', lightFromEvent);

function tapAnimal(a) {
  if (!G.running || a.found) return;
  if (!isLit(a)) return; // в темноте не видно, кто это
  const s = SPOTS[a.spot];
  if (a.target && (G.foundCount[a.id] || 0) < G.c.need[a.id]) {
    a.found = true;
    G.foundCount[a.id] = (G.foundCount[a.id] || 0) + 1;
    sfx.found();
    const b = boxOf(a);
    removeAnimal(a);
    const g = document.createElementNS(NS, 'g');
    g.innerHTML = `<circle cx="${s.x}" cy="${b.y + b.s * .55}" r="${b.s * .62}" fill="#fff6c8" opacity=".22"/>
      <g class="found-an"><svg x="${b.x}" y="${b.y}" width="${b.s}" height="${b.s}" viewBox="0 0 100 100">${ANIMALS[a.id].svg}</svg></g>
      <circle cx="${b.x + b.s * .9}" cy="${b.y + b.s * .1}" r="9" fill="#5ed47a" stroke="#1f1a2e" stroke-width="2.5"/>
      <path d="M${b.x + b.s * .9 - 4} ${b.y + b.s * .1} l3 3 l5 -6" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
    $('found').appendChild(g);
    floatText(s.x, b.y, ANIMALS[a.id].name + '!', '#5ed47a');
    drawTask();
    const done = Object.entries(G.c.need).every(([id, q]) => (G.foundCount[id] || 0) >= q);
    if (done) setTimeout(win, 500);
  } else {
    sfx.wrong();
    G.battery = Math.max(0, G.battery - 3);
    drawBattery();
    $('stage').classList.remove('shake'); void $('stage').offsetWidth; $('stage').classList.add('shake');
    floatText(s.x, s.y - s.s, `${ANIMALS[a.id].name}? Не тот! −3 сек`, '#ff8a8a');
  }
}

function floatText(x, y, text, color) {
  const r = scene.getBoundingClientRect(), st = $('stage').getBoundingClientRect();
  const d = document.createElement('div');
  d.className = 'float'; d.textContent = text; d.style.color = color;
  d.style.left = (x / 360 * r.width) + 'px'; d.style.top = (y / 540 * r.height) + 'px';
  d.style.transform = 'translateX(-50%)';
  $('stage').appendChild(d);
  // не даём надписи вылезти за край
  requestAnimationFrame(() => {
    const dr = d.getBoundingClientRect();
    if (dr.left < st.left + 4) d.style.left = (parseFloat(d.style.left) + (st.left + 4 - dr.left)) + 'px';
    if (dr.right > st.right - 4) d.style.left = (parseFloat(d.style.left) - (dr.right - st.right + 4)) + 'px';
  });
  setTimeout(() => d.remove(), 1000);
}

function taskHtml() {
  return Object.entries(G.c.need).map(([id, q]) => {
    const f = G.foundCount[id] || 0;
    return `<span class="it ${f >= q ? 'done' : ''}">${animalIcon(id, 40)}${f}/${q}</span>`;
  }).join('');
}
function drawTask() { $('task').innerHTML = taskHtml(); }
function drawBattery() { $('battery').innerHTML = ICON.battery(Math.max(0, G.battery / G.c.battery)); }

function card(html) { $('card').innerHTML = html; $('overlay').classList.add('on'); }

function win() {
  if (!G.running) return;
  G.running = false; stopTimers();
  const k = G.battery / G.c.battery;
  const stars = k > .5 ? 3 : k > .25 ? 2 : 1;
  progress.stars[G.n] = Math.max(progress.stars[G.n] || 0, stars);
  progress.night = Math.max(progress.night, G.n + 1);
  store.set('zoo.progress', progress);
  sfx.win();
  card(`<h2>Все нашлись!</h2>
    <div class="stars">${[0, 1, 2].map(i => ICON.star(i < stars, 46)).join('')}</div>
    <p>${stars === 3 ? 'Фонарик ещё почти полный. Отличный сторож!' : stars === 2 ? 'Хорошо! В следующий раз можно ещё быстрее.' : 'Еле успели — фонарик почти сел!'}</p>
    <button class="big go" id="nextBtn">Ночь №${G.n + 1} →</button>
    <button class="big" id="againBtn">Пройти ещё раз</button>`);
  $('nextBtn').onclick = () => startNight(G.n + 1);
  $('againBtn').onclick = () => startNight(G.n);
}
function lose() {
  G.running = false; stopTimers();
  sfx.lose();
  const left = Object.entries(G.c.need).reduce((s, [id, q]) => s + q - (G.foundCount[id] || 0), 0);
  card(`<h2>Фонарик сел!</h2>
    <p>Осталось найти: ${left}. Звери ещё прячутся — попробуй снова!</p>
    <button class="big go" id="retryBtn">Ещё раз</button>
    <button class="big" id="loseMenu">В меню</button>`);
  $('retryBtn').onclick = () => startNight(G.n);
  $('loseMenu').onclick = drawMenu;
}

drawMenu();
</script>
